<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 240px;
            height: 240px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .line-h {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0, 255, 0, 0.5);
        }

        .line-v {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
            background: rgba(0, 255, 0, 0.5);
        }

        .label-h {
            position: absolute;
            left: 2px;
            color: lime;
            font-size: 10px;
            z-index: 10;
            font-family: sans-serif;
            transform: translateY(-50%);
        }

        .label-v {
            position: absolute;
            top: 2px;
            color: lime;
            font-size: 10px;
            z-index: 10;
            font-family: sans-serif;
            transform: translateX(-50%);
            writing-mode: vertical-lr;
        }
    </style>
</head>

<body>
    <div class='container' id='cont'>
        <img src='/kathakali.jpg' />
        <div class='grid' id='grid'></div>
    </div>
    <script>
        const grid = document.getElementById('grid');
        for (let i = 0; i <= 100; i += 5) {
            grid.innerHTML += `<div class='line-h' style='top:${i}%'></div><div class='label-h' style='top:${i}%'>${i}%</div>`;
            grid.innerHTML += `<div class='line-v' style='left:${i}%'></div><div class='label-v' style='left:${i}%'>${i}%</div>`;
        }
    </script>
</body>

</html>
